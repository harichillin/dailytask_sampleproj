<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>

        <form action="{{ url_for('add_task') }}" method="POST" class="add-form">
            <input type="text" name="title" placeholder="What do you need to do?" required>
            <button type="submit">Add</button>
        </form>

        {% if tasks %}
        <ul class="task-list">
            {% for task in tasks %}
            <li class="{{ 'done' if task['done'] else '' }}">
                <span class="task-title">{{ task['title'] }}</span>
                <div class="task-actions">
                    <form action="{{ url_for('complete_task', task_id=task['id']) }}" method="POST">
                        <button type="submit" class="btn-complete">
                            {{ 'Undo' if task['done'] else 'Done' }}
                        </button>
                    </form>
                    <form action="{{ url_for('delete_task', task_id=task['id']) }}" method="POST">
                        <button type="submit" class="btn-delete">Delete</button>
                    </form>
                </div>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <p class="empty-msg">No tasks yet. Add one above!</p>
        {% endif %}
    </div>
</body>
</html>
